name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Actions-based Pages deployment: no gh-pages branch, no build output in git.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # The demo is a project site at /chat-ui/, so asset URLs need that base.
      - name: Build demo
        run: npm run build:demo
        env:
          DEMO_BASE: /chat-ui/

      # Static hosts have no idea about client-side routes: every unknown path returns 404.html.
      - name: SPA fallback for deep links
        run: cp demo-dist/index.html demo-dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo-dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
