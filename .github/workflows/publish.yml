name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Trusted publishing (OIDC). No npm token: the job exchanges this ID token for a
# short-lived publish credential that only this workflow can use.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Never cache a release build.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; do not rely on the bundled one.
      - name: Ensure npm supports OIDC
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # No NODE_AUTH_TOKEN. The npm CLI detects the OIDC environment and
      # authenticates itself. Provenance attestations are generated automatically.
      - name: Publish
        run: npm publish
